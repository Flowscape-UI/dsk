<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <title>Your ideas. Your tools. Your DSK.</title>
  <desc>DSK brand banner with a dark dotted canvas, pink accents, and a connected rotation control.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#7b174c" stop-opacity=".55"/><stop offset="1" stop-color="#101010" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="800" y1="60" x2="1090" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#ff007a"/><stop offset="1" stop-color="#ac38e4"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#48404a"/></pattern>
  </defs>
  <path fill="#101010" d="M0 0h1200v400H0z"/>
  <path fill="url(#dots)" d="M650 0h550v400H650z"/>
  <ellipse cx="965" cy="215" rx="340" ry="260" fill="url(#glow)"/>
  <path stroke="#343034" d="M.5.5h1199v399H.5z"/>
  <text x="64" y="63" fill="#aba3ae" font-family="monospace" font-size="12" letter-spacing="3">OPEN SOURCE / BUILT FOR BUILDERS</text>
  <g font-family="Inter,Arial,sans-serif" font-size="62" font-weight="750" letter-spacing="-3">
    <text x="60" y="145" fill="white">Your ideas.</text>
    <text x="60" y="212" fill="white">Your tools.</text>
    <text x="60" y="279" fill="#ff007a">Your DSK.</text>
  </g>
  <text x="64" y="343" fill="#bdb7c0" font-family="Arial,sans-serif" font-size="17">Small, precise components. Endless room to create.</text>
  <path d="M782 205h70q22 0 22 22v52q0 22 22 22h55" stroke="#ff007a" stroke-width="2" stroke-dasharray="5 6"/>
  <rect x="636" y="105" width="148" height="172" rx="8" fill="#151315" stroke="#4c3744"/>
  <text x="652" y="131" fill="#bcb2bd" font-family="Arial,sans-serif" font-size="12">ROTATION</text>
  <circle cx="710" cy="203" r="44" stroke="#4c3744"/>
  <path d="M710 159a44 44 0 0 1 31 13l-31 31z" fill="#ff007a" fill-opacity=".2"/>
  <path d="m710 203 31-31" stroke="#ff007a" stroke-width="2"/>
  <circle cx="741" cy="172" r="5" fill="#ff007a" stroke="white" stroke-width="2"/>
  <text x="710" y="212" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="21" font-weight="700">45°</text>
  <g transform="rotate(18 995 195)">
    <rect x="911" y="111" width="168" height="168" rx="22" fill="url(#accent)"/>
    <text x="995" y="211" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-4">dsk</text>
  </g>
  <circle cx="784" cy="205" r="5" fill="#101010" stroke="#ff007a" stroke-width="2"/>
  <circle cx="952" cy="301" r="5" fill="#101010" stroke="#ff007a" stroke-width="2"/>
</svg>
